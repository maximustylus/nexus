name: Deploy to Firebase Hosting and Functions on merge
'on':
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Frontend Dependencies
        run: npm install
        
      - name: Test Frontend
        run: npm test

      - name: Lint Frontend
        run: npm run lint

      - name: Build Frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./functions
        run: npm ci

      # ⚠️ `firestore:rules` IS LOAD-BEARING AND WAS ADDED 2026-08-18 WITH THE
      # `firestore` SECTION IN `firebase.json`. Declaring the rules file there is
      # NOT enough on its own: `--only functions` excludes rules, so the pipeline
      # would go green, the runbook would say "wired", and the authorization
      # boundary would be unchanged. Both halves or neither.
      #
      # ⚠️ `firestore:indexes` IS THE SAME LESSON, LEARNED A SECOND TIME. v2 changed
      # the notification bell's query from `where('recipient','==',displayName)` on
      # a root collection to `where('recipientUid','==',uid) + orderBy('timestamp')`
      # on a team subcollection. That needs a composite index the project does not
      # have, and until now this repository deployed no indexes at all — there was
      # no `firestore.indexes.json` on any branch and no `indexes` key in
      # `firebase.json`.
      #
      # The failure mode is why it is here rather than in a checklist: that listener
      # is the one with no error callback (`App.jsx`), so a missing index shows the
      # bell as permanently empty, with no banner and nothing in the UI to explain
      # it. An empty bell is indistinguishable from having no notifications.
      - name: Deploy Backend (Functions) and Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore:rules,firestore:indexes
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          PROJECT_ID: idc-app-e0c59

      - name: Deploy Frontend (Hosting)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: idc-app-e0c59
          target: production
