name: Deploy to Firebase Hosting and Functions on merge
'on':
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Frontend Dependencies
        run: npm install
        
      - name: Test Frontend
        run: npm test

      - name: Lint Frontend
        run: npm run lint

      # `VITE_APPCHECK_SITE_KEY` is the CLIENT half of `CP7`. Absent, the App Check
      # block in `src/firebase.js` does nothing and the app behaves exactly as it
      # does today — which is what makes shipping it before anybody registers a key
      # safe. A site key is NOT a secret (it is served to every browser), so it is a
      # repository VARIABLE rather than a secret; an unset variable is an empty
      # string, which is falsy, which is the inert path.
      - name: Build Frontend
        run: npm run build
        env:
          VITE_APPCHECK_SITE_KEY: '${{ vars.VITE_APPCHECK_SITE_KEY }}'

      - name: Install Backend Dependencies
        working-directory: ./functions
        run: npm ci

      # ⚠️ `firestore:rules` IS LOAD-BEARING AND WAS ADDED 2026-08-18 WITH THE
      # `firestore` SECTION IN `firebase.json`. Declaring the rules file there is
      # NOT enough on its own: `--only functions` excludes rules, so the pipeline
      # would go green, the runbook would say "wired", and the authorization
      # boundary would be unchanged. Both halves or neither.
      #
      # ⚠️ `firestore:indexes` IS THE SAME LESSON, LEARNED A SECOND TIME. v2 changed
      # the notification bell's query from `where('recipient','==',displayName)` on
      # a root collection to `where('recipientUid','==',uid) + orderBy('timestamp')`
      # on a team subcollection. That needs a composite index the project does not
      # have, and until now this repository deployed no indexes at all — there was
      # no `firestore.indexes.json` on any branch and no `indexes` key in
      # `firebase.json`.
      #
      # The failure mode is why it is here rather than in a checklist: that listener
      # is the one with no error callback (`App.jsx`), so a missing index shows the
      # bell as permanently empty, with no banner and nothing in the UI to explain
      # it. An empty bell is indistinguishable from having no notifications.

      # ⚠️ THE FUNCTION'S ENVIRONMENT, WRITTEN HERE RATHER THAN COMMITTED. Firebase
      # reads `functions/.env` at deploy time, so this is the supported way to give
      # a v2 function a variable — and writing it from repository settings is what
      # keeps `RATE_LIMIT_SALT` out of the repository. A salt that lives in git is
      # not a salt: the counter ids in `rate_limits` are hashes of caller addresses,
      # and the IPv4 space is small enough that anybody holding both the salt and
      # the database can enumerate it.
      #
      # Both are optional and both fail SAFE when unset:
      #   ENFORCE_APP_CHECK  unset -> App Check observed and logged, never enforced.
      #                      Do not set this until the logs say attested traffic is
      #                      ~100%; setting it early takes the public screening
      #                      offline nationally. See COMMUNITY_TODO.md.
      #   RATE_LIMIT_SALT    unset -> a built-in salt. The rate limit still works;
      #                      the stored tokens are obfuscated rather than
      #                      irreversible.
      - name: Write function environment
        working-directory: ./functions
        run: |
          : > .env
          if [ -n "${ENFORCE_APP_CHECK}" ]; then echo "ENFORCE_APP_CHECK=${ENFORCE_APP_CHECK}" >> .env; fi
          if [ -n "${RATE_LIMIT_SALT}" ]; then echo "RATE_LIMIT_SALT=${RATE_LIMIT_SALT}" >> .env; fi
          echo "functions/.env written with $(wc -l < .env) variable(s)"
        env:
          ENFORCE_APP_CHECK: '${{ vars.ENFORCE_APP_CHECK }}'
          RATE_LIMIT_SALT: '${{ secrets.RATE_LIMIT_SALT }}'

      - name: Deploy Backend (Functions) and Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore:rules,firestore:indexes
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          PROJECT_ID: idc-app-e0c59

      - name: Deploy Frontend (Hosting)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: idc-app-e0c59
          target: production
